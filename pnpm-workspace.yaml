packages:
  - apps/*
  - packages/*

minimumReleaseAge: 7200 # 5 days (in minutes)
minimumReleaseAgeExclude:
  - '@biomejs/biome'
  - '@biomejs/cli-darwin-arm64'
  - '@biomejs/cli-darwin-x64'
  - '@biomejs/cli-linux-arm64-musl'
  - '@biomejs/cli-linux-arm64'
  - '@biomejs/cli-linux-x64-musl'
  - '@biomejs/cli-linux-x64'
  - '@biomejs/cli-win32-arm64'
  - '@biomejs/cli-win32-x64'
  - quasar@2.23.3
  - brace-expansion@2.1.3 || 2.1.4 || 5.0.9
  - postcss@8.5.23
  - undici@7.29.0
  - fast-uri@3.1.5
  - nanoid@3.3.17

allowBuilds:
  '@parcel/watcher': true
  cypress: true
  esbuild: true

publicHoistPattern:
  - '*vue*'
  - '*vite*'
  - '*quasar*'
  - '*eslint*'
  - '*typescript*'
  - '@types/*'
  - '*esbuild*'
  - '*rollup*'
overrides:
  minimatch@>=10.0.0 <10.2.1: '>=10.2.1'
  minimatch@>=10.0.0 <10.2.3: '>=10.2.3'
  qs@>=6.11.1 <=6.15.1: ^6.15.2
  serialize-javascript@<7.0.5: '>=7.0.5'
  serialize-javascript@<=7.0.2: '>=7.0.3'
  glob@^10.4.2: '^13.0.6'
  glob@^11.0.1: '^13.0.6'
  glob@^11.1.0: '^13.0.6'
  source-map@^0.8.0-beta.0: '0.7.4'
  brace-expansion@>=2.0.0 <2.1.2: ^2.1.2
  brace-expansion@>=2.0.0 <2.1.3: ^2.1.3
  fast-uri@>=3.0.0 <3.1.3: ^3.1.3
  fast-uri@>=3.0.0 <=3.1.3: ^3.1.4
  postcss@<=8.5.17: ^8.5.18
  quasar@<=2.21.4: ^2.21.5
  brace-expansion@>=2.0.0 <2.1.4: ^2.1.4
  fast-uri@>=3.0.0 <3.1.5: ^3.1.5
  postcss@<=8.5.22: ^8.5.23
  nanoid@<3.3.17: ^3.3.17
